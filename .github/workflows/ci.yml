# .github/workflows/ci.yml
name: CI
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          check-latest: true
          cache: pnpm # caches via pnpm-lock.yaml
          cache-dependency-path: pnpm-lock.yaml

      # Make pnpm available
      - name: Enable Corepack
        run: corepack enable

      # Pin pnpm (or rely on package.json "packageManager")
      - name: Activate pnpm
        run: corepack prepare pnpm@10.15.0 --activate

      - name: Show pnpm version
        run: pnpm -v

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test
