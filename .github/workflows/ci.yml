# .github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install Node and enable pnpm caching (uses pnpm-lock.yaml)
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # or 22/24 if you prefer
          check-latest: true
          cache: "pnpm" # 👈 important
          cache-dependency-path: pnpm-lock.yaml

      # Use pnpm via Corepack (recommended)
      - name: Enable Corepack
        run: corepack enable

      # Pin the pnpm version (optional; or rely on package.json "packageManager")
      - name: Activate pnpm
        run: corepack prepare pnpm@10.15.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test
