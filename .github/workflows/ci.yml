name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Show versions
        run: |
          node -v
          npm -v

      - name: Install deps (clean)
        run: npm ci

      - name: Build
        run: npm run build
